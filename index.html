<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solara Quest — MVP</title>
  </head>
  <body>
    <main id="app">
      <div id="hud">
        <section class="brand">
          <p class="eyebrow">SOLARA QUEST</p>
          <h1>Combat Sandbox</h1>
          <p>WASD bewegen · Maus zielen · <strong>Shift dashen</strong> · rechte Maustaste halten zum Drehen</p>
          <div id="class-picker" class="class-picker" aria-label="Klasse wählen"></div>
        </section>
        <section class="status" aria-live="polite">
          <div class="vitals"><span id="class-status">SOLARIS WARDEN</span><div class="bar"><i id="health-fill"></i><i id="shield-fill"></i></div><span id="health-status">180 / 180</span></div>
          <span id="floor-status">FLOOR 1 · LEVEL 1</span>
          <span id="dash-status">DASH READY</span>
          <span id="position-status">X 0 · Y 0</span>
        </section>
        <section id="abilities" class="abilities" aria-label="Fähigkeiten"></section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
